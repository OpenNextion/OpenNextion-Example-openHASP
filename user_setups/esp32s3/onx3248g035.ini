;***************************************************;
;  ONX3248G035 V1.2 ESP32-S3 3.5" touch display     ;
;          - ST7796U TFT SPI 4-WIRE                 ;
;          - CST826 capacitive touch controller      ;
;***************************************************;
;
; Hardware reference:
; - Schematic: ONX3248G035 V1.2
; - Vendor demo: esp32s3_nextion-main
;
; Scope:
; - This setup enables the openHASP essentials: display, touch, backlight,
;   network, LittleFS and PSRAM.
; - Board peripherals exposed through PCF8574A, such as audio, RTC, SD card,
;   camera and expanded interrupt lines, are intentionally left out.

[onx3248g035]
extends = arduino_esp32s3_v2
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi

build_flags =
    ${arduino_esp32s3_v2.build_flags}
    ${esp32s3.ps_ram}

;region -- LovyanGFX display options ---------------------
    -D LGFX_USE_V1=1
    -D ST7796_DRIVER=1
    -D SUPPORT_TRANSACTIONS
    -D TFT_ROTATION=0
; The ST7796U controller is initialized from the vendor demo as 480x320,
; but the demo exposes the LVGL surface as 320x480 for the physical portrait
; panel. openHASP must use the same logical orientation to refresh the full
; visible screen instead of leaving the lower area with stale GRAM data.
    -D TFT_WIDTH=320
    -D TFT_HEIGHT=480

; ST7796U SPI pins from the vendor demo board.h.
; The schematic names GPIO2 as IO2_LCD_MISO, but the demo uses the same net
; as LCD_CS and initializes the SPI bus without a MISO line.
    -D TFT_SCLK=5
    -D TFT_MOSI=1
    -D TFT_MISO=-1
    -D TFT_CS=2
    -D TFT_DC=3
    -D TFT_RST=-1
    -D TFT_BUSY=-1
    -D TFT_BCKL=6
    -D BACKLIGHT_FREQUENCY=10000
    -D SPI_FREQUENCY=80000000
    -D SPI_READ_FREQUENCY=0
    -D TFT_DMA_CHANNEL=1
;endregion

;region -- Touch options ---------------------------------
; The panel uses a CST826 controller at I2C address 0x15. TP_INT is routed
; through the board PCF8574A expander instead of a direct ESP32-S3 GPIO, so
; the driver polls the CST826 coordinate registers without an interrupt pin.
    -D TOUCH_DRIVER=0x826
    -D TOUCH_SDA=8
    -D TOUCH_SCL=7
    -D TOUCH_IRQ=-1
    -D TOUCH_RST=-1
    -D TOUCH_WIDTH=320
    -D TOUCH_HEIGHT=480
    -D TOUCH_OFFSET_ROTATION=0
    -D I2C_TOUCH_PORT=0
    -D I2C_TOUCH_ADDRESS=0x15
    -D I2C_TOUCH_FREQUENCY=400000
;endregion

lib_deps =
    ${arduino_esp32s3_v2.lib_deps}
    ${lovyangfx.lib_deps}


[env:onx3248g035]
extends = onx3248g035, flash_16mb
build_flags =
    -D HASP_MODEL="ONX3248G035 V1.2"
    ${onx3248g035.build_flags}
